<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Students - Course Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background: #f9f9f9; font-weight: 600; }
        .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #45a049; }
        .btn-secondary { background: #2196F3; }
        .input-group { margin: 10px 0; }
        .input-group label { display: inline-block; width: 150px; font-weight: 600; }
        .input-group input, .input-group select { padding: 8px; width: 300px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Student Management</h1>
        <div>
            <a href="/admin-dashboard" class="btn" sec:authorize="hasRole('ADMIN')">Back to Admin Dashboard</a>
            <a href="/faculty-dashboard" class="btn btn-secondary" sec:authorize="hasRole('FACULTY')">Back to Faculty Dashboard</a>
            <form action="/logout" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn">Logout</button>
            </form>
        </div>
    </div>
    
    <div class="section">
        <h2>Search Students</h2>
        <div class="input-group">
            <label>Search Keyword:</label>
            <input type="text" id="search-keyword" placeholder="Search by name or email">
            <button class="btn" onclick="searchStudents()">Search</button>
        </div>
        <div class="input-group">
            <label>Filter by Department:</label>
            <select id="department-filter" onchange="filterByDepartment()">
                <option value="">All Departments</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Electrical Engineering">Electrical Engineering</option>
                <option value="Mechanical Engineering">Mechanical Engineering</option>
                <option value="Civil Engineering">Civil Engineering</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
            </select>
        </div>
    </div>
    
    <div class="section">
        <h2>All Students</h2>
        <div id="students-container">
            <p>Loading students...</p>
        </div>
    </div>
    
    <script>
        let allStudents = [];

        function loadAllStudents() {
            fetch('/api/students', { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.students) {
                    allStudents = data.students;
                    displayStudents(allStudents);
                } else {
                    document.getElementById('students-container').innerHTML = '<p>No students found.</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('students-container').innerHTML = '<p>Error loading students. You may not have permission to view this page.</p>';
            });
        }

        function displayStudents(students) {
            const container = document.getElementById('students-container');
            if (students && students.length > 0) {
                let html = '<table><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Phone</th><th>Department</th><th>Enrollment Date</th><th>Actions</th></tr>';
                students.forEach(student => {
                    html += `<tr>
                        <td>${student.studentId}</td>
                        <td>${student.firstName}</td>
                        <td>${student.lastName}</td>
                        <td>${student.user ? student.user.email : 'N/A'}</td>
                        <td>${student.user ? student.user.phone : 'N/A'}</td>
                        <td>${student.department}</td>
                        <td>${student.enrollmentDate || 'N/A'}</td>
                        <td>
                            <button class="btn" style="padding:5px 10px; font-size:12px;" onclick="viewEnrollments(${student.studentId})">
                                View Enrollments
                            </button>
                            <button class="btn btn-secondary" style="padding:5px 10px; font-size:12px;" onclick="viewGrades(${student.studentId})">
                                View Grades
                            </button>
                        </td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p>No students found.</p>';
            }
        }

        function searchStudents() {
            const keyword = document.getElementById('search-keyword').value.trim();
            if (!keyword) {
                displayStudents(allStudents);
                return;
            }

            fetch(`/api/students/search?keyword=${encodeURIComponent(keyword)}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.students) {
                    displayStudents(data.students);
                } else {
                    displayStudents([]);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error searching students');
            });
        }

        function filterByDepartment() {
            const dept = document.getElementById('department-filter').value;
            if (!dept) {
                displayStudents(allStudents);
                return;
            }

            fetch(`/api/students/department/${encodeURIComponent(dept)}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.students) {
                    displayStudents(data.students);
                } else {
                    displayStudents([]);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error filtering students');
            });
        }

        function viewEnrollments(studentId) {
            fetch(`/api/enrollments/student/${studentId}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.enrollments) {
                    let msg = `Total Enrollments: ${data.count}\n\nCourses:\n`;
                    data.enrollments.forEach(e => {
                        msg += `- ${e.course.courseCode}: ${e.course.courseName} (${e.status})\n`;
                    });
                    alert(msg);
                } else {
                    alert('No enrollments found for this student');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error loading enrollments');
            });
        }

        function viewGrades(studentId) {
            fetch(`/api/grades/student/${studentId}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.grades) {
                    let msg = `Total Grades: ${data.count}\n\nGrades:\n`;
                    data.grades.forEach(g => {
                        msg += `- ${g.enrollment.course.courseCode}: ${g.grade} (${g.totalMarks})\n`;
                    });
                    
                    // Fetch GPA
                    fetch(`/api/grades/student/${studentId}/gpa`, { credentials: 'include' })
                    .then(response => response.json())
                    .then(gpaData => {
                        if (gpaData.success) {
                            msg += `\nGPA: ${gpaData.gpa.toFixed(2)} / 4.0`;
                        }
                        alert(msg);
                    })
                    .catch(() => alert(msg));
                } else {
                    alert('No grades found for this student');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error loading grades');
            });
        }

        window.addEventListener('DOMContentLoaded', loadAllStudents);
    </script>
</body>
</html>
