<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Courses - Course Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background: #f9f9f9; font-weight: 600; }
        .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #45a049; }
        .btn-secondary { background: #2196F3; }
        .input-group { margin: 10px 0; }
        .input-group label { display: inline-block; width: 150px; font-weight: 600; }
        .input-group input, .input-group select { padding: 8px; width: 300px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Course Management</h1>
        <div>
            <a href="/admin-dashboard" class="btn" sec:authorize="hasRole('ADMIN')">Back to Admin Dashboard</a>
            <a href="/faculty-dashboard" class="btn btn-secondary" sec:authorize="hasRole('FACULTY')">Back to Faculty Dashboard</a>
            <form action="/logout" method="post" style="display:inline;">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button type="submit" class="btn">Logout</button>
            </form>
        </div>
    </div>
    
    <div class="section">
        <h2>Search Courses</h2>
        <div class="input-group">
            <label>Search Keyword:</label>
            <input type="text" id="search-keyword" placeholder="Search by code, name, or description">
            <button class="btn" onclick="searchCourses()">Search</button>
        </div>
        <div class="input-group">
            <label>Filter by Semester:</label>
            <select id="semester-filter" onchange="filterBySemester()">
                <option value="">All Semesters</option>
                <option value="Spring 2024">Spring 2024</option>
                <option value="Fall 2024">Fall 2024</option>
                <option value="Spring 2025">Spring 2025</option>
                <option value="Fall 2025">Fall 2025</option>
            </select>
        </div>
    </div>
    
    <div class="section">
        <h2>All Courses</h2>
        <div id="courses-container">
            <p>Loading courses...</p>
        </div>
    </div>
    
    <script>
        let allCourses = [];

        function loadAllCourses() {
            fetch('/api/courses', { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.courses) {
                    allCourses = data.courses;
                    displayCourses(allCourses);
                } else {
                    document.getElementById('courses-container').innerHTML = '<p>No courses available.</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('courses-container').innerHTML = '<p>Error loading courses.</p>';
            });
        }

        function displayCourses(courses) {
            const container = document.getElementById('courses-container');
            if (courses && courses.length > 0) {
                let html = '<table><tr><th>Code</th><th>Name</th><th>Credits</th><th>Department</th><th>Faculty</th><th>Semester</th><th>Enrolled/Capacity</th><th>Description</th><th>Actions</th></tr>';
                courses.forEach(course => {
                    const facultyName = course.faculty ? `${course.faculty.firstName} ${course.faculty.lastName}` : 'N/A';
                    const department = course.faculty ? course.faculty.department : 'N/A';
                    html += `<tr>
                        <td>${course.courseCode}</td>
                        <td>${course.courseName}</td>
                        <td>${course.credits}</td>
                        <td>${department}</td>
                        <td>${facultyName}</td>
                        <td>${course.semester}</td>
                        <td>${course.currentEnrollment}/${course.maxCapacity}</td>
                        <td>${course.description || 'N/A'}</td>
                        <td>
                            <button class="btn" style="padding:5px 10px; font-size:12px;" onclick="viewEnrollments(${course.courseId})">
                                View Enrollments
                            </button>
                        </td>
                    </tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<p>No courses found.</p>';
            }
        }

        function searchCourses() {
            const keyword = document.getElementById('search-keyword').value.trim();
            if (!keyword) {
                displayCourses(allCourses);
                return;
            }

            fetch(`/api/courses/search?keyword=${encodeURIComponent(keyword)}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.courses) {
                    displayCourses(data.courses);
                } else {
                    displayCourses([]);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error searching courses');
            });
        }

        function filterBySemester() {
            const semester = document.getElementById('semester-filter').value;
            if (!semester) {
                displayCourses(allCourses);
                return;
            }

            fetch(`/api/courses/semester/${encodeURIComponent(semester)}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.courses) {
                    displayCourses(data.courses);
                } else {
                    displayCourses([]);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error filtering courses');
            });
        }

        function viewEnrollments(courseId) {
            fetch(`/api/courses/${courseId}/enrollments`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.enrollments) {
                    let msg = `Course: ${data.courseName}\nTotal Enrollments: ${data.count}\n\nStudents:\n`;
                    data.enrollments.forEach(e => {
                        msg += `- ${e.student.firstName} ${e.student.lastName} (${e.status})\n`;
                    });
                    alert(msg);
                } else {
                    alert('No enrollments found for this course');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error loading enrollments');
            });
        }

        window.addEventListener('DOMContentLoaded', loadAllCourses);
    </script>
</body>
</html>
