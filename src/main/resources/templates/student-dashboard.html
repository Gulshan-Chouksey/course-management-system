<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard - Course Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .header { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .section { background: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; }
        table th, table td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        table th { background: #f9f9f9; font-weight: 600; }
        .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #45a049; }
        .btn-secondary { background: #2196F3; }
        .btn-danger { background: #f44336; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .badge-active { background: #c8e6c9; color: #2e7d32; }
        .badge-withdrawn { background: #ffcdd2; color: #c62828; }
        .badge-completed { background: #bbdefb; color: #1565c0; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px 20px; background: white; border: none; cursor: pointer; border-radius: 4px; }
        .tab.active { background: #4CAF50; color: white; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Student Dashboard</h1>
        <form action="/logout" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn">Logout</button>
        </form>
    </div>
    
    <div class="tabs">
        <button class="tab active" onclick="showTab('available')">Available Courses</button>
        <button class="tab" onclick="showTab('enrolled')">My Enrollments</button>
        <button class="tab" onclick="showTab('grades')">My Grades</button>
    </div>
    
    <div id="available-tab" class="section">
        <h2>Available Courses</h2>
        <div id="courses-container">
            <p>Loading courses...</p>
        </div>
    </div>
    
    <div id="enrolled-tab" class="section" style="display:none;">
        <h2>My Enrollments</h2>
        <div id="enrollments-container">
            <p>Loading enrollments...</p>
        </div>
    </div>
    
    <div id="grades-tab" class="section" style="display:none;">
        <h2>My Grades</h2>
        <div id="grades-container">
            <p>Loading grades...</p>
        </div>
        <div id="gpa-container" style="margin-top: 20px; padding: 15px; background: #e8f5e9; border-radius: 4px;">
            <strong>Overall GPA: </strong><span id="gpa-value">-</span>
        </div>
    </div>
    
    <script th:inline="javascript">
        let currentUser = null;
        let studentId = null;
        
        // Get CSRF token from Thymeleaf
        const csrfToken = /*[[${_csrf.token}]]*/ '';
        const csrfHeader = /*[[${_csrf.headerName}]]*/ '';
        
        // Helper function to add CSRF token to fetch headers
        function getHeaders(additionalHeaders = {}) {
            const headers = {
                'Content-Type': 'application/json',
                ...additionalHeaders
            };
            if (csrfToken && csrfHeader) {
                headers[csrfHeader] = csrfToken;
            }
            return headers;
        }

        function showTab(tabName) {
            // Hide all tabs
            document.getElementById('available-tab').style.display = 'none';
            document.getElementById('enrolled-tab').style.display = 'none';
            document.getElementById('grades-tab').style.display = 'none';
            
            // Remove active class from all tab buttons
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            
            // Show selected tab
            document.getElementById(tabName + '-tab').style.display = 'block';
            event.target.classList.add('active');
            
            // Load data for the tab
            if (tabName === 'enrolled') {
                loadMyEnrollments();
            } else if (tabName === 'grades') {
                loadMyGrades();
            }
        }

        function loadCurrentUser() {
            // Get current student profile using the new /api/students/me endpoint
            fetch('/api/students/me', { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success && data.student) {
                    studentId = data.student.studentId;
                    console.log('Student ID:', studentId);
                    loadCourses();
                } else {
                    console.error('Failed to load student profile:', data.message);
                    document.getElementById('courses-container').innerHTML = 
                        '<p>Error: ' + (data.message || 'Could not load student profile') + '</p>';
                }
            })
            .catch(error => {
                console.error('Error loading student profile:', error);
                document.getElementById('courses-container').innerHTML = 
                    '<p>Error loading student profile. Please check console for details.</p>';
            });
        }

        function loadCourses() {
            fetch('/api/courses', { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('courses-container');
                if (data.success && data.courses && data.courses.length > 0) {
                    let html = '<table><tr><th>Code</th><th>Name</th><th>Credits</th><th>Faculty</th><th>Semester</th><th>Available Seats</th><th>Action</th></tr>';
                    data.courses.forEach(course => {
                        const facultyName = course.faculty ? `${course.faculty.firstName} ${course.faculty.lastName}` : 'N/A';
                        const availableSeats = course.maxCapacity - course.currentEnrollment;
                        html += `<tr>
                            <td>${course.courseCode}</td>
                            <td>${course.courseName}</td>
                            <td>${course.credits}</td>
                            <td>${facultyName}</td>
                            <td>${course.semester}</td>
                            <td>${availableSeats}</td>
                            <td>
                                <button class="btn" onclick="enrollCourse(${course.courseId})" ${availableSeats <= 0 ? 'disabled' : ''}>
                                    Enroll
                                </button>
                            </td>
                        </tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p>No courses available.</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('courses-container').innerHTML = '<p>Error loading courses.</p>';
            });
        }

        function enrollCourse(courseId) {
            if (!studentId) {
                alert('Student ID not found. Please refresh the page.');
                return;
            }

            fetch('/api/enrollments/enroll', {
                method: 'POST',
                headers: getHeaders(),
                credentials: 'include',
                body: JSON.stringify({ 
                    studentId: studentId, 
                    courseId: courseId,
                    academicYear: '2025-2026'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    loadCourses(); // Refresh course list
                } else {
                    alert('Enrollment failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error enrolling in course');
            });
        }

        function loadMyEnrollments() {
            if (!studentId) return;

            fetch(`/api/enrollments/student/${studentId}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('enrollments-container');
                if (data.success && data.enrollments && data.enrollments.length > 0) {
                    let html = '<table><tr><th>Course Code</th><th>Course Name</th><th>Faculty</th><th>Status</th><th>Enrollment Date</th><th>Action</th></tr>';
                    data.enrollments.forEach(enrollment => {
                        const course = enrollment.course;
                        const faculty = course.faculty ? `${course.faculty.firstName} ${course.faculty.lastName}` : 'N/A';
                        const statusClass = enrollment.status.toLowerCase();
                        html += `<tr>
                            <td>${course.courseCode}</td>
                            <td>${course.courseName}</td>
                            <td>${faculty}</td>
                            <td><span class="badge badge-${statusClass}">${enrollment.status}</span></td>
                            <td>${new Date(enrollment.enrollmentDate).toLocaleDateString()}</td>
                            <td>
                                ${enrollment.status === 'ACTIVE' ? 
                                    `<button class="btn btn-danger" onclick="withdrawEnrollment(${enrollment.enrollmentId})">Withdraw</button>` : 
                                    '-'}
                            </td>
                        </tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<p>No enrollments found.</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('enrollments-container').innerHTML = '<p>Error loading enrollments.</p>';
            });
        }

        function withdrawEnrollment(enrollmentId) {
            if (!confirm('Are you sure you want to withdraw from this course?')) return;

            fetch(`/api/enrollments/${enrollmentId}/withdraw`, {
                method: 'PUT',
                headers: getHeaders(),
                credentials: 'include'
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert(data.message);
                    loadMyEnrollments();
                } else {
                    alert('Withdrawal failed: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Error withdrawing from course');
            });
        }

        function loadMyGrades() {
            if (!studentId) return;

            fetch(`/api/grades/student/${studentId}`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('grades-container');
                if (data.success && data.grades && data.grades.length > 0) {
                    let html = '<table><tr><th>Course Code</th><th>Course Name</th><th>Internal</th><th>External</th><th>Total</th><th>Grade</th><th>Remarks</th></tr>';
                    data.grades.forEach(grade => {
                        const course = grade.enrollment.course;
                        html += `<tr>
                            <td>${course.courseCode}</td>
                            <td>${course.courseName}</td>
                            <td>${grade.internalMarks}</td>
                            <td>${grade.externalMarks}</td>
                            <td>${grade.totalMarks}</td>
                            <td><strong>${grade.grade}</strong></td>
                            <td>${grade.remarks || '-'}</td>
                        </tr>`;
                    });
                    html += '</table>';
                    container.innerHTML = html;
                    
                    // Load GPA
                    loadGPA();
                } else {
                    container.innerHTML = '<p>No grades found.</p>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('grades-container').innerHTML = '<p>Error loading grades.</p>';
            });
        }

        function loadGPA() {
            if (!studentId) return;

            fetch(`/api/grades/student/${studentId}/gpa`, { credentials: 'include' })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('gpa-value').textContent = data.gpa.toFixed(2) + ' / 4.0';
                }
            })
            .catch(error => console.error('Error loading GPA:', error));
        }

        window.addEventListener('DOMContentLoaded', loadCurrentUser);
    </script>
</body>
</html>
